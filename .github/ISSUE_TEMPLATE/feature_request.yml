name: Feature request
description: Suggest an improvement to MacDroid.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the task or difficulty this feature would address.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
